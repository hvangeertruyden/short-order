<!doctype html>
<html><head><meta charset="utf-8"><title>Model inspector</title>
<style>body{margin:0;background:#222;color:#eee;font:12px monospace} canvas{display:block} #info{white-space:pre;padding:8px}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head><body>
<div id="info"></div>
<script type="module">
// Dev helper: loads a .glb from /models, reports its size and parts, and renders it.
//   /tools/inspect.html?m=booth
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const name = new URLSearchParams(location.search).get('m') || 'booth';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(900, 560); renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x555555);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new THREE.PerspectiveCamera(40, 900 / 560, 0.01, 5000);
const gltf = await new GLTFLoader().loadAsync(`/models/${name}.glb`);
const root = gltf.scene; scene.add(root);
root.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(root), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
let tris = 0; const lines = [];
const walk = (o, d) => {
  if (d > 4) return;
  let t = 0; o.traverse((m) => { if (m.isMesh) t += (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3; });
  const b = new THREE.Box3().setFromObject(o), s = b.getSize(new THREE.Vector3()), cc = b.getCenter(new THREE.Vector3());
  if (o.children.length || o.isMesh) lines.push(`${'  '.repeat(d)}${o.name || o.type} [${o.children.length}] tris=${t | 0} size=${s.toArray().map((v) => v.toFixed(2))} ctr=${cc.toArray().map((v) => v.toFixed(2))}`);
  if (o.children.length < 40) for (const ch of o.children) walk(ch, d + 1);
};
root.traverse((m) => { if (m.isMesh) tris += (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3; });
walk(root, 0);
document.getElementById('info').textContent = `${name}: size ${size.toArray().map((v) => v.toFixed(3))} centre ${c.toArray().map((v) => v.toFixed(3))} min ${box.min.toArray().map((v) => v.toFixed(3))} tris ${tris | 0}\n` + lines.slice(0, 80).join('\n');
window.__info = document.getElementById('info').textContent;
const r = size.length();
const v = (new URLSearchParams(location.search).get('v') || '0.8,0.5,1.1').split(',').map(Number); cam.position.set(c.x + r * v[0], c.y + r * v[1], c.z + r * v[2]); cam.near = r / 200; cam.far = r * 20; cam.updateProjectionMatrix(); cam.lookAt(c);
renderer.render(scene, cam);
window.__done = true;
</script></body></html>
